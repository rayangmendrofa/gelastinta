<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GH-1 Farm — a farm run by a real PLC program</title>
<meta name="description" content="A pixel farm seen from above, run by a real IEC 61131-3 PLC program: greenhouses with irrigation, fertigation and climate control, plus animals, live in your browser.">
<meta name="theme-color" content="#1c2140">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="icon" type="image/png" sizes="40x40" href="img/logo.png">
<link rel="apple-touch-icon" href="img/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GH-1 Farm">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #0f1222; --win: #1c2140; --win2: #262c52; --edge: #070914; --hi: #3d4680; --ink: #f1ecd8; --muted: #9aa0c4;
    --leaf: #6cc37a; --leaf-d: #2f6b3a; --gold: #f2c14e; --gold-d: #a6761b; --red: #e0574b; --red-d: #8a2a22;
    --sky: #5aa9e6; --soil: #5b3b26;
    --sat: env(safe-area-inset-top); --sab: env(safe-area-inset-bottom); --sal: env(safe-area-inset-left); --sar: env(safe-area-inset-right);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: #1e3320; overscroll-behavior: none; }
  body { color: var(--ink); font: 16px/1.3 "Pixelify Sans", ui-monospace, monospace; -webkit-font-smoothing: none;
         -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }

  /* the game fills the screen; everything else floats over the farm */
  #app { position: fixed; inset: 0; overflow: hidden; }
  canvas#farm { position: absolute; left: 0; top: 0; display: block; image-rendering: pixelated; touch-action: none; cursor: grab; }
  canvas#farm:focus-visible { outline: 3px solid var(--gold); outline-offset: -3px; }
  .top { position: absolute; top: 0; left: 0; right: 0; z-index: 4; pointer-events: none;
         padding: calc(6px + var(--sat)) calc(8px + var(--sar)) 14px calc(8px + var(--sal));
         background: linear-gradient(#0b0d18e0, #0b0d18a0 70%, #0b0d1800); }
  .top > * { pointer-events: auto; }
  .bottom { position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 6px;
            padding: 14px calc(6px + var(--sar)) calc(6px + var(--sab)) calc(6px + var(--sal)); background: linear-gradient(#0b0d1800, #0b0d18b0 40%, #0b0d18e0); }
  .bottom > * { pointer-events: auto; }

  .win { position: relative; background: var(--win); padding: 10px 12px;
         box-shadow: inset 0 0 0 3px var(--edge), inset 0 0 0 6px var(--hi), 0 4px 0 var(--edge); }

  /* HUD */
  .hud { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
  .hud .grp, .grp { display: flex; align-items: center; gap: 4px; }
  .logo { width: 40px; height: 40px; image-rendering: pixelated; }
  .clock { font-size: 24px; font-weight: 700; letter-spacing: 1px; color: var(--gold); text-shadow: 2px 2px 0 var(--edge); }
  .chip { background: var(--win2); padding: 3px 8px; box-shadow: inset 0 0 0 2px var(--edge); font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
  .chip img { width: 16px; height: 16px; image-rendering: pixelated; }
  .spacer { flex: 1; }
  .lots { display: flex; gap: 4px; margin-top: 6px; align-items: center; }
  .lots .btn { font-size: 13px; min-height: 28px; padding: 2px 8px; }
  .dot { width: 8px; height: 8px; background: var(--red); box-shadow: 0 0 0 2px var(--edge); display: inline-block; }
  .dot.ripe { background: var(--gold); }
  .news { flex-wrap: wrap; gap: 4px; } .news .chip, .news .btn { font-size: 13px; } .news .chip img, .news .btn img { width: 14px; height: 14px; }
  .stats { font-size: 12px; color: var(--muted); text-shadow: 1px 1px 0 var(--edge); margin-top: 4px; }
  .lvl { display: inline-flex; align-items: center; gap: 6px; }
  .lvl .bar { width: 70px; height: 10px; margin: 0; }

  #loading { position: absolute; inset: 0; z-index: 9; display: grid; place-items: center; text-align: center; padding: 20px; background: #0b0d18; }
  #loading .big { font-size: 22px; color: var(--gold); }
  .loadbar { width: 220px; height: 14px; margin: 10px auto 0; box-shadow: inset 0 0 0 2px var(--edge); background: var(--win2); overflow: hidden; }
  .loadbar i { display: block; height: 100%; width: 30%; background: repeating-linear-gradient(90deg, var(--leaf) 0 8px, var(--leaf-d) 8px 10px);
               animation: load 1.2s steps(10) infinite; }
  @keyframes load { from { transform: translateX(-100%); } to { transform: translateX(330%); } }

  /* pixel buttons */
  .btn { font: inherit; font-size: 15px; color: var(--ink); background: #4a5590; border: 0; padding: 6px 12px; cursor: pointer; min-height: 34px;
         box-shadow: inset -3px -3px 0 #2b3260, inset 3px 3px 0 #7581c4, 0 3px 0 var(--edge); display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover:not(:disabled) { filter: brightness(1.12); }
  .btn:active:not(:disabled) { transform: translateY(2px); box-shadow: inset -3px -3px 0 #2b3260, inset 3px 3px 0 #7581c4, 0 1px 0 var(--edge); }
  .btn:disabled { filter: grayscale(.8) brightness(.7); cursor: not-allowed; }
  .btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .btn.on, .btn.go { background: var(--leaf); color: #0d2412; box-shadow: inset -3px -3px 0 var(--leaf-d), inset 3px 3px 0 #a7e8b0, 0 3px 0 var(--edge); }
  .btn.warn { background: var(--gold); color: #2a1c00; box-shadow: inset -3px -3px 0 var(--gold-d), inset 3px 3px 0 #ffe39a, 0 3px 0 var(--edge); }
  .btn.bad { background: var(--red); box-shadow: inset -3px -3px 0 var(--red-d), inset 3px 3px 0 #f59a8f, 0 3px 0 var(--edge); }
  .btn.icon { padding: 5px; min-width: 34px; justify-content: center; }
  .btn img { width: 16px; height: 16px; image-rendering: pixelated; }
  .btn.sm { font-size: 13px; min-height: 28px; padding: 3px 8px; }

  /* seed and item bar */
  .hotbar { display: flex; gap: 5px; padding: 6px; max-width: 100%; overflow-x: auto; scrollbar-width: thin; scroll-snap-type: x proximity;
            background: var(--win); box-shadow: inset 0 0 0 3px var(--edge), inset 0 0 0 5px var(--hi); }
  .slot { flex: none; width: 54px; height: 58px; background: var(--win2); border: 0; cursor: pointer; position: relative; color: var(--ink); font: inherit; scroll-snap-align: start;
          box-shadow: inset 0 0 0 3px var(--edge), inset 0 0 0 5px #333a6b; display: grid; place-items: center; padding: 4px 0 2px; }
  .slot canvas { width: 32px; height: 32px; image-rendering: pixelated; }
  .slot span { font-size: 11px; line-height: 1; }
  .slot.on { box-shadow: inset 0 0 0 3px var(--edge), inset 0 0 0 5px var(--gold); background: #3a3566; }
  .slot:focus-visible { outline: 3px solid var(--gold); }
  .slot.locked { filter: grayscale(1) brightness(.6); cursor: not-allowed; }
  .slot .lock { position: absolute; top: 2px; right: 3px; font-size: 10px; color: var(--gold); }
  .slot .count { position: absolute; bottom: 14px; right: 4px; font-size: 11px; color: var(--gold); text-shadow: 1px 1px 0 var(--edge); }
  .hotbar .sep { flex: none; width: 3px; background: var(--edge); margin: 4px 2px; }
  .seedinfo { text-align: center; font-size: 13px; color: var(--ink); text-shadow: 1px 1px 0 var(--edge); max-width: 100%; }
  .seedinfo .btn { margin: 4px 2px 0; }
  .seedinfo:empty { display: none; }

  /* menu bar */
  .dock { display: flex; gap: 4px; padding: 4px; background: var(--win); box-shadow: inset 0 0 0 3px var(--edge), inset 0 0 0 5px var(--hi), 0 3px 0 var(--edge); }
  .dock .btn { flex-direction: column; gap: 2px; font-size: 11px; min-height: 50px; min-width: 60px; padding: 4px 6px; }
  .dock .btn img { width: 20px; height: 20px; }

  /* panels */
  h2 { font-size: 15px; margin: 12px 0 6px; color: var(--gold); letter-spacing: 1px; }
  .kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; }
  .kv div { background: var(--win2); padding: 4px 8px; box-shadow: inset 0 0 0 2px var(--edge); min-width: 0; }
  .kv span { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kv b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .bar { height: 14px; background: #0b0d18; box-shadow: inset 0 0 0 2px var(--edge); margin: 2px 0 8px; position: relative; }
  .bar i { position: absolute; left: 2px; top: 2px; bottom: 2px; width: 0; transition: width .3s steps(8);
           background: repeating-linear-gradient(90deg, var(--leaf) 0 6px, var(--leaf-d) 6px 8px); }
  .bar.hp i { background: repeating-linear-gradient(90deg, #e86a5b 0 6px, var(--red-d) 6px 8px); }
  .bar.hp.ok i { background: repeating-linear-gradient(90deg, #ff9fb0 0 6px, #b24b62 6px 8px); }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
  .small { font-size: 13px; color: var(--muted); }
  .badge { display: inline-block; font-size: 12px; padding: 1px 6px; margin: 2px 3px 2px 0; background: var(--win2); box-shadow: inset 0 0 0 2px var(--edge); }
  .badge.warn { color: #2a1c00; background: var(--gold); } .badge.bad { background: var(--red); } .badge.ok { color: #0d2412; background: var(--leaf); }
  .alarms { font-size: 13px; max-height: 140px; overflow: auto; margin-top: 8px; }
  .alarms div { padding: 3px 0; border-bottom: 2px dotted #333a6b; }
  .sp label { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; font-size: 14px; margin-bottom: 8px; }
  .sp b { color: var(--gold); }
  input[type=range] { grid-column: 1 / -1; width: 100%; -webkit-appearance: none; appearance: none; height: 14px; background: #0b0d18;
                      box-shadow: inset 0 0 0 2px var(--edge); margin: 0; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 20px; background: var(--gold); box-shadow: inset -2px -2px 0 var(--gold-d); cursor: pointer; }
  input[type=range]::-moz-range-thumb { width: 16px; height: 20px; background: var(--gold); border: 0; border-radius: 0; cursor: pointer; }
  input[type=range]:focus-visible { outline: 3px solid var(--gold); }
  select { font: inherit; font-size: 14px; color: var(--ink); background: var(--win2); border: 0; padding: 5px 6px; min-height: 32px; box-shadow: inset 0 0 0 2px var(--edge); }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .result { background: var(--win2); padding: 8px 10px; margin-top: 8px; font-size: 14px; box-shadow: inset 0 0 0 2px var(--edge); }
  .result.good { box-shadow: inset 0 0 0 2px var(--leaf); } .result.badr { box-shadow: inset 0 0 0 2px var(--red); }
  .result dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 6px 0 0; font-size: 13px; } .result dt { color: var(--gold); } .result dd { margin: 0; }
  .pop { position: absolute; z-index: 6; top: calc(84px + var(--sat)); right: calc(8px + var(--sar)); width: min(390px, calc(100% - 16px));
         max-height: calc(100% - 84px - 170px - var(--sat) - var(--sab)); overflow: auto; -webkit-user-select: text; user-select: text;
         background: var(--win); padding: 10px 12px; box-shadow: inset 0 0 0 3px var(--edge), inset 0 0 0 6px var(--hi), 0 4px 0 var(--edge); }
  .pophead { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; color: var(--gold); letter-spacing: 1px; }
  .pop h3 { font-size: 14px; color: var(--gold); margin: 10px 0 4px; letter-spacing: 1px; }
  .pop .note { font-size: 12px; color: var(--muted); }
  .pop ul { margin: 4px 0 6px; padding-left: 18px; font-size: 13px; color: var(--muted); }
  .pop a { color: var(--gold); }
  .parked { font-size: 13px; color: var(--muted); background: var(--win2); padding: 4px 8px; margin-bottom: 8px; box-shadow: inset 0 0 0 2px var(--edge); }
  .diag { margin-top: 10px; padding: 8px; background: #3a1f2c; box-shadow: inset 0 0 0 2px var(--red); }
  .diag h3 { margin-top: 0; color: #ff9f93; }
  .shop > div, .ach > div { background: var(--win2); padding: 6px 8px; box-shadow: inset 0 0 0 2px var(--edge); margin-bottom: 5px; display: flex; align-items: center; gap: 8px; }
  .shop .what { flex: 1; min-width: 0; } .shop .what .small { display: block; }
  .ach { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; }
  .ach > div { margin: 0; align-items: flex-start; font-size: 13px; }
  .ach > div.no { opacity: .45; }
  .ach img, .shop img { width: 16px; height: 16px; image-rendering: pixelated; flex: none; }
  .ach b { display: block; color: var(--ink); }
  .sheet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
  .sheet-grid .btn { justify-content: center; }
  .pen-stat { display: grid; grid-template-columns: 70px 1fr 42px; gap: 4px 8px; align-items: center; font-size: 13px; }
  .pen-stat .bar { margin: 0; }
  .map { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .map .btn { flex-direction: column; justify-content: center; min-height: 74px; font-size: 12px; text-align: center; padding: 4px; }
  .map .btn.own { background: #3e6a3a; box-shadow: inset -3px -3px 0 #24401f, inset 3px 3px 0 #6aa060, 0 3px 0 var(--edge); }
  .map .btn.sale { background: #7a5a2a; box-shadow: inset -3px -3px 0 #4a3418, inset 3px 3px 0 #b08a50, 0 3px 0 var(--edge); }
  .map .btn.wild { background: #2a3a2a; color: var(--muted); }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-top: 3px; }
  .cal div { background: var(--win2); box-shadow: inset 0 0 0 2px var(--edge); min-height: 38px; padding: 2px 3px; font-size: 11px; position: relative; display: flex; flex-direction: column; align-items: center; }
  .cal div.past { opacity: .45; } .cal div.today { box-shadow: inset 0 0 0 2px var(--gold); background: #3a3566; }
  .cal img { width: 14px; height: 14px; image-rendering: pixelated; } .cal .fest { color: var(--gold); position: absolute; top: 0; right: 3px; }
  .steps { background: var(--win2); padding: 8px 10px; margin-top: 6px; box-shadow: inset 0 0 0 2px var(--edge); font-size: 14px; }
  .steps.here { box-shadow: inset 0 0 0 2px var(--gold); } .steps b { color: var(--gold); }
  .key { display: inline-block; padding: 0 5px; background: var(--night); box-shadow: inset 0 0 0 1px var(--hi); }

  /* the farmer guide: a speech bubble over the farm */
  .guide { display: flex; gap: 8px; align-items: stretch; background: #f1ecd8; color: #2a2238; padding: 6px; width: min(560px, 100%);
           box-shadow: inset 0 0 0 3px var(--edge), inset 0 0 0 5px #c9b98f, 0 3px 0 var(--edge); }
  .guide canvas { width: 84px; height: 81px; image-rendering: pixelated; background: #d9cfa9; box-shadow: inset 0 0 0 2px #a8996e; flex: none; }
  .guide .say { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .guide .who { font-size: 12px; color: #8a5a2b; font-weight: 700; letter-spacing: 1px; }
  .guide #sayText { flex: 1; font-size: 15px; line-height: 1.3; margin: 2px 0 4px; min-height: 40px; }
  .guide .row { margin-top: 0; justify-content: flex-end; }
  .guide.min { width: auto; padding: 3px 6px; } .guide.min canvas, .guide.min #sayText, .guide.min #sayNext, .guide.min .who { display: none; }

  #toast { position: fixed; left: 50%; top: calc(96px + var(--sat)); transform: translateX(-50%); z-index: 9; width: max-content; max-width: 92vw; pointer-events: none; }
  #toast div { background: var(--win); padding: 8px 14px; margin-top: 6px; box-shadow: inset 0 0 0 3px var(--edge), inset 0 0 0 5px var(--gold), 0 4px 0 var(--edge);
               animation: pop .2s steps(3); }
  @keyframes pop { from { transform: scale(.6); } to { transform: scale(1); } }
  code { color: var(--ink); }

  /* phones and small windows */
  @media (max-width: 700px), (max-height: 520px) {
    .clock { font-size: 19px; } .hud { gap: 4px 6px; } .hud .chip { font-size: 12px; padding: 2px 6px; } .logo { display: none; }
    #speeds, .stats { display: none; }
    .lots { overflow-x: auto; scrollbar-width: none; } .lots > * { flex: none; }
    .guide canvas { width: 56px; height: 54px; } .guide #sayText { font-size: 13px; min-height: 0; }
    .slot { width: 48px; height: 54px; } .slot canvas { width: 28px; height: 28px; }
    .dock { width: 100%; } .dock .btn { flex: 1; min-width: 0; min-height: 48px; }
    .pop { left: 0; right: 0; bottom: 0; top: auto; width: auto; max-height: 64%; padding-bottom: calc(10px + var(--sab)); }
    #toast { top: calc(70px + var(--sat)); }
  }
  @media (max-height: 520px) and (orientation: landscape) { .guide { display: none; } .seedinfo { display: none; } }
  @media (min-width: 1000px) and (min-height: 521px) {      /* wide screens: the farmer talks from the corner, the farm stays clear */
    .guide { position: absolute; left: calc(10px + var(--sal)); bottom: calc(10px + var(--sab)); width: 340px; }
  }
  @media (prefers-reduced-motion: reduce) { .loadbar i, #toast div { animation: none; } .bar i { transition: none; } }
</style>
</head>
<body>
<div id="app">
  <canvas id="farm" width="320" height="200" tabindex="0"
    aria-label="The farm seen from above. Drag or use the arrow keys to move around. Tap a bed, the tank, the pump, the roof, the PLC cabinet, a pen or a plot for sale to open its panel."></canvas>

  <header class="top">
    <div class="hud">
      <img class="logo" id="logo" src="img/logo.png" width="40" height="40" alt="" aria-hidden="true">
      <span class="clock" id="clock">--:--</span>
      <span class="chip" id="day">DAY 1</span>
      <span class="chip" title="Coins"><img id="ico-coin" alt="">&nbsp;<b id="coins">0</b></span>
      <span class="chip lvl" title="Level: every kg you harvest is 1 xp"><b id="lvl">LV 1</b><span class="bar"><i id="xpbar"></i></span></span>
      <span id="boosts" class="grp"></span>
      <span class="spacer"></span>
      <span class="grp" id="weather" role="group" aria-label="Weather"></span>
      <span class="grp" id="speeds" role="group" aria-label="Speed"></span>
      <button class="btn icon sm" id="quickSpeed" aria-label="Speed"></button>
    </div>
    <div class="lots"><span id="lots" class="grp" role="group" aria-label="Go to a place on the farm"></span><span class="spacer"></span>
      <span id="news" class="grp news" aria-label="Today"></span></div>
    <div class="stats"><b id="kg">0</b> kg · <b id="harvests">0</b> harvests · <b id="lost">0</b> lost · <span id="speedtxt"></span></div>
  </header>

  <div class="pop" id="pop" hidden role="dialog" aria-labelledby="popTitle">
    <div class="pophead"><b id="popTitle"></b><button class="btn icon sm" data-act="close" aria-label="Close">✕</button></div>
    <div id="popBody"></div>
  </div>

  <footer class="bottom">
    <div class="guide" id="guide" aria-live="polite">
      <canvas id="farmer" width="56" height="54" aria-hidden="true"></canvas>
      <div class="say">
        <div class="who">FARMER</div>
        <div id="sayText">…</div>
        <div class="row"><button class="btn sm" id="sayNext">Next ▸</button><button class="btn sm" id="sayHide">Hide</button></div>
      </div>
    </div>
    <div class="seedinfo" id="seedinfo"></div>
    <div class="hotbar" id="hotbar" role="group" aria-label="Seeds and items"></div>
    <nav class="dock" id="dock" aria-label="Game menu"></nav>
  </footer>

  <div id="loading"><div><div class="big">Starting the PLC…</div><div class="small" id="loadmsg">Loading Python (Pyodide)…</div>
    <div class="loadbar"><i></i></div><div class="small" style="margin-top:8px">The first visit downloads about 10 MB, then it is cached and works offline.</div></div></div>
</div>
<div id="toast" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
